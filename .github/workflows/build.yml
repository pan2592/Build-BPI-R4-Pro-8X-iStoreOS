name: Build BPI-R4 Pro 8X iStoreOS

on:
  workflow_dispatch:
    inputs:
      include_wifi:
        description: '包含 WiFi 7 BE14 驱动 (mt_wifi / MT7995)'
        type: boolean
        default: true
      include_passwall:
        description: '包含 PassWall 插件'
        type: boolean
        default: true
      include_istore:
        description: '包含 iStore 应用商店'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false

    steps:
      - name: 初始化编译环境
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-distutils rsync unzip zlib1g-dev file wget \
            subversion patch autoconf automake curl libtool-bin libelf-dev ccache

      - name: 克隆 immortalwrt-mt798x 源码
        run: |
          git clone --depth 1 https://github.com/hanwckf/immortalwrt-mt798x.git
          cd immortalwrt-mt798x
          echo "REPO_DIR=$(pwd)" >> $GITHUB_ENV

      - name: 添加 feeds (iStore + PassWall)
        working-directory: immortalwrt-mt798x
        run: |
          # iStore 应用商店
          echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          
          # PassWall 及依赖 (kenzok8 源)
          echo 'src-git kenzo https://github.com/kenzok8/openwrt-packages' >> feeds.conf.default
          echo 'src-git small https://github.com/kenzok8/small' >> feeds.conf.default

      - name: 更新 & 安装 feeds
        working-directory: immortalwrt-mt798x
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载 BPI-R4 SD 卡 defconfig
        working-directory: immortalwrt-mt798x
        run: |
          cp defconfig/mt7988-bananapi_bpi-r4-sd.config .config
          
          # 基础配置
          echo 'CONFIG_TARGET_mediatek_mt7988_DEVICE_bananapi_bpi-r4=y' >> .config
          echo 'CONFIG_CCACHE=y' >> .config

      - name: 启用 WiFi 7 BE14 驱动 (MT7995)
        if: ${{ inputs.include_wifi }}
        working-directory: immortalwrt-mt798x
        run: |
          cat >> .config << 'WIFI_EOF'
          # MTK WiFi 7 闭源驱动 (BPI-R4-NIC-BE14 = MT7995AV)
          CONFIG_PACKAGE_mt_wifi=y
          CONFIG_PACKAGE_hostapd-mtk=y
          CONFIG_PACKAGE_wifi-profile=y
          # PCIe 支持
          CONFIG_PACKAGE_kmod-mhi-pci-generic=y
          WIFI_EOF

      - name: 启用 iStore 应用商店
        if: ${{ inputs.include_istore }}
        working-directory: immortalwrt-mt798x
        run: |
          cat >> .config << 'ISTORE_EOF'
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-quickstart=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-app-diskman=y
          ISTORE_EOF

      - name: 启用 PassWall
        if: ${{ inputs.include_passwall }}
        working-directory: immortalwrt-mt798x
        run: |
          cat >> .config << 'PW_EOF'
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Sing-box=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_GO=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Trojan_Plus=y
          # PassWall2 可选
          CONFIG_PACKAGE_luci-app-passwall2=y
          PW_EOF

      - name: 通用推荐包
        working-directory: immortalwrt-mt798x
        run: |
          cat >> .config << 'EXTRA_EOF'
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_mwan3=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fstrim=y
          CONFIG_PACKAGE_luci-app-ddns-go=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-filebrowser=y
          EXTRA_EOF

      - name: 展开配置依赖
        working-directory: immortalwrt-mt798x
        run: make defconfig

      - name: 下载源码包
        working-directory: immortalwrt-mt798x
        run: make -j$(nproc) download V=s

      - name: 编译固件
        working-directory: immortalwrt-mt798x
        run: make -j$(nproc) V=s

      - name: 整理产物
        run: |
          mkdir -p release
          cd immortalwrt-mt798x/bin/targets/mediatek/mt7988/
          # 收集所有固件文件
          for f in *bpi-r4*; do
            cp "$f" "${GITHUB_WORKSPACE}/release/" 2>/dev/null || true
          done
          # 生成 SHA256
          cd "${GITHUB_WORKSPACE}/release"
          sha256sum * > sha256sums.txt

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: BPI-R4-Pro-8X-iStoreOS
          path: release/
          retention-days: 7

      - name: 编译摘要
        run: |
          echo "============================================"
          echo "  编译完成！"
          echo "  目标: BPI-R4 Pro 8X (MT7988A)"
          echo "  启动方式: SD 卡"
          echo "  WiFi 7 BE14: ${{ inputs.include_wifi }}"
          echo "  PassWall:    ${{ inputs.include_passwall }}"
          echo "  iStore:      ${{ inputs.include_istore }}"
          echo "============================================"
          echo ""
          echo "产物列表:"
          ls -lh release/
